<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test variantes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:#E9EAEC;font-family:Inter,sans-serif;}</style>
</head>
<body>
<div id="root"></div>
<script src="../tpl-catalog.js"></script>
<script type="text/babel" src="../icons.jsx"></script>
<script type="text/babel" src="../tpl-families.jsx"></script>
<script type="text/babel">
const combos = [
  ['editorial','classic'],['editorial','cover'],['editorial','split'],
  ['classique','centered'],['classique','sidebar'],['classique','band'],
  ['minimal','list'],['minimal','center'],['minimal','index'],
  ['sombre','panel'],['sombre','hero'],['sombre','mono'],
];
function pick(fam, variant){
  return window.TEMPLATES.find(t => t.famille===fam && t.variant===variant) || { famille:fam, variant, couleur:'#2E7D32', name:fam };
}
function App(){
  return <div style={{display:'grid', gridTemplateColumns:'repeat(3, 300px)', justifyContent:'center', gap:24, padding:24}}>
    {combos.map(([fam,v])=>{ const tpl=pick(fam,v); return (
      <div key={fam+v} style={{display:'flex', flexDirection:'column', alignItems:'center', gap:8}}>
        <div style={{fontSize:13, fontWeight:700, color:'#18181B'}}>{fam} · {v} <span style={{color:'#999',fontWeight:500}}>({tpl.name})</span></div>
        <PhonePreview tpl={tpl} formData={window.SAMPLE_FORMDATA} />
      </div>
    );})}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
